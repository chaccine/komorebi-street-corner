// Project the actual roof panels, foliage, awnings and pavement along the fall
// vector once. A drop stops at its first receiving surface, from any viewpoint.
function buildDistrictRainShelter(batches,leanX,leanZ){
  const cells=97,scale=(cells-1)/16,heights=new Float32Array(cells*cells);
  heights.fill(-.145);
  for(const batch of batches){
    if(batch.motion==='wheel'||batch.motion==='cloth')continue;
    const v=batch.data;
    for(let i=0;i<batch.used;i+=33){
      const ay=v[i+1],by=v[i+12],cy=v[i+23];
      if(Math.max(ay,by,cy)<-.14)continue;
      const ax=(v[i]+ay*leanX+8)*scale,az=(v[i+2]+ay*leanZ+8)*scale;
      const bx=(v[i+11]+by*leanX+8)*scale-ax,bz=(v[i+13]+by*leanZ+8)*scale-az;
      const cx=(v[i+22]+cy*leanX+8)*scale-ax,cz=(v[i+24]+cy*leanZ+8)*scale-az;
      const area=bx*cz-bz*cx;
      if(Math.abs(area)<.0001)continue;
      const x0=Math.max(0,Math.ceil(ax+Math.min(0,bx,cx))),x1=Math.min(cells-1,Math.floor(ax+Math.max(0,bx,cx)));
      const z0=Math.max(0,Math.ceil(az+Math.min(0,bz,cz))),z1=Math.min(cells-1,Math.floor(az+Math.max(0,bz,cz)));
      for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++){
        const u=((x-ax)*cz-(z-az)*cx)/area,w=(bx*(z-az)-bz*(x-ax))/area;
        if(u<0||w<0||u+w>1)continue;
        const key=z*cells+x,y=ay+u*(by-ay)+w*(cy-ay);
        if(y>heights[key])heights[key]=y;
      }
    }
  }
  return (x,z)=>{
    const col=Math.max(0,Math.min(cells-2,Math.floor((x+8)*scale)));
    const row=Math.max(0,Math.min(cells-2,Math.floor((z+8)*scale))),i=row*cells+col;
    return Math.max(heights[i],heights[i+1],heights[i+cells],heights[i+cells+1]);
  };
}

function createDistrictDrizzle(gl,batches=[]){
  const leanX=.070,leanZ=-.023;
  const shelter=buildDistrictRainShelter(batches,leanX,leanZ);
  const vertex=`#version 300 es
  precision highp float;
  layout(location=0) in vec3 tip;
  layout(location=1) in vec3 brush;
  uniform mat4 matrix;
  uniform vec2 viewport;
  out vec2 uv;
  out float opacity;
  void main(){
    float side=float(2*(gl_VertexID&1)-1),along=float(gl_VertexID>>1);
    vec4 a=matrix*vec4(tip,1.);
    vec4 b=matrix*vec4(tip+brush.x*vec3(-.070,1.,.023),1.);
    vec2 tangent=(b.xy-a.xy)*.5*viewport;
    float size=length(tangent);
    vec2 normal=size>.001?vec2(tangent.y,-tangent.x)/size:vec2(1.,0.);
    float ppu=length(vec3(matrix[0].x,matrix[1].x,matrix[2].x))*viewport.x*.5;
    float radius=clamp(brush.y*ppu,.8,3.4);
    gl_Position=mix(a,b,along);
    gl_Position.xy+=normal*radius*side*2./viewport;
    uv=vec2(side,along);opacity=brush.z;
  }`;
  const fragment=`#version 300 es
  precision highp float;
  in vec2 uv;
  in float opacity;
  uniform highp sampler2D sceneDepth;
  out vec4 color;
  void main(){
    if(gl_FragCoord.z>texelFetch(sceneDepth,ivec2(gl_FragCoord.xy),0).r+.000025)discard;
    float tail=uv.y;
    float width=mix(.78,.36,tail);
    float soft=(1.-smoothstep(width*.16,width+.16,abs(uv.x)))*smoothstep(0.,.13,tail)*(1.-smoothstep(.60,1.,tail));
    vec3 ink=mix(vec3(.53,.68,.65),vec3(.93,.97,.82),(.28+.58*(1.-tail))*(1.-.24*abs(uv.x)));
    color=vec4(ink,opacity*soft);
  }`;

    const s=gl.createShader(type);
    gl.shaderSource(s,source);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
      const error=gl.getShaderInfoLog(s);gl.deleteShader(s);throw Error(error);
    }
    return s;
  }
  const program=gl.createProgram(),vs=compile(gl.VERTEX_SHADER,vertex),fs=compile(gl.FRAGMENT_SHADER,fragment);
  gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
  gl.deleteShader(vs);gl.deleteShader(fs);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS)){const msg=gl.getProgramInfoLog(program);gl.deleteProgram(program);throw Error(msg);}
  const uniforms={};
  for(const name of ['matrix','viewport','sceneDepth'])uniforms[name]=gl.getUniformLocation(program,name);
  const count=164,data=new Float32Array(count*6),vao=gl.createVertexArray(),buffer=gl.createBuffer();
  const oldVao=gl.getParameter(gl.VERTEX_ARRAY_BINDING),oldBuffer=gl.getParameter(gl.ARRAY_BUFFER_BINDING);
  gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,data.byteLength,gl.DYNAMIC_DRAW);
  for(let i=0;i<2;i++){
    gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,24,i*12);gl.vertexAttribDivisor(i,1);
  }
  gl.bindVertexArray(oldVao);gl.bindBuffer(gl.ARRAY_BUFFER,oldBuffer);
  function noise(n){
    n=Math.imul(n^(n>>>16),0x7feb352d);n=Math.imul(n^(n>>>15),0x846ca68b);
    return ((n^(n>>>16))>>>0)/4294967296;
  }
  const tracks=Array.from({length:count},(_,i)=>({
    period:1.70+noise(173+i)*1.01,offset:noise(1321+i)*2.78,speed:6.3+noise(271+i)*2.0,
    length:.21+noise(731+i)*.24,width:.013+.007*noise(539+i),opacity:.54+.28*noise(97+i),cycle:-1
  }));
  function draw({matrix,depth,width,height,rainTime,rainAmount,mobile,economy}){
    if(!rainAmount||!depth||!Number.isFinite(rainTime))return;
    const limit=economy?69:mobile?106:count,amount=Math.min(1,Math.max(0,rainAmount));
    let n=0;
    for(let i=0;i<limit;i++){
      const t=tracks[i],time=rainTime+t.offset,cycle=Math.floor(time/t.period);
      if(t.cycle!==cycle){
        t.cycle=cycle;
        const key=Math.imul(cycle+11,10607)+i*383;
        t.x=-7.51+noise(key)*15.03;t.z=-7.73+noise(key+4)*15.32;
        t.top=5.80+noise(key+19)*2.04;t.floor=shelter(t.x,t.z);
        t.gate=noise(key+9);

      if(y<=t.floor)continue;
      const x=t.x-y*leanX,z=t.z-y*leanZ;

  const tau=2*Math.PI;
  function workshop(x0,z0) {
    const point=([x,y,z])=>[x+x0,y,z+z0];
    return {
      box:(x,y,z,w,h,d,c)=>g.box(point([x,y,z]),[w,h,d],c),
      face:(vertices,c)=>g.face(vertices.map(point),c),
      rod:(a,b,r,c,s=8,r2=r)=>g.rod(point(a),point(b),r,c,s,r2),
      line:(path,r,c,s=6)=>g.line(path.map(point),r,c,s),
      ball:(x,y,z,rx,ry,rz,c,s=10,n=6)=>g.ball(point([x,y,z]),[rx,ry,rz],c,s,n),
      sign:(t,x,y,z,w,h,fg,bg)=>g.sign(t,point([x,y,z]),w,h,fg,bg)
    };
  }

  function pot(b,x,y,z,s,leaf,clay) {
    b.rod([x,y,z],[x,y+.19*s,z],.10*s,clay,8,.145*s);
    b.rod([x,y+.177*s,z],[x,y+.207*s,z],.149*s,clay,8);
    for(let i=0;i<6;i++){
      const a=i*2.39+.3,length=s*(.19+.035*(i%3)),h=s*(.18+.045*((i*2)%3));
      const tip=[x+Math.cos(a)*length,y+.23*s+h,z+Math.sin(a)*length];
      const side=[-.048*s*Math.sin(a),.048*s*Math.cos(a)];
      const mid=[(x+tip[0])*.5,y+.29*s+h*.45,(z+tip[2])*.5];
      const base=[x,y+.19*s,z];
      b.face([base,[mid[0]+side[0],mid[1],mid[2]+side[1]],tip,mid],leaf);
      b.face([base,mid,tip,[mid[0]-side[0],mid[1]-.02*s,mid[2]-side[1]]],i%2?'#65915d':'#799954');

const wheelDuration=4.4, wheelTravel=25.5;
function wheelProgress(seconds){
  const t=Math.min(1,Math.max(0,seconds/wheelDuration));
  return t*(2-t);
}

function createDistrictAudio(){
  let muted=false,context=null,master=null,camera=null,visible=true,spinVoice=null;
  const samples=new Map(),voices=new Set(),rate=24000;
  try{muted=localStorage.getItem('haruma.district.muted')==='yes';}catch{}
  function wake(){
    if(!visible)return;
    if(!context){
      const Engine=window.AudioContext||window.webkitAudioContext;
      if(!Engine)return;
      try{context=new Engine({latencyHint:'interactive'});}catch{return;}
      master=context.createGain();master.gain.value=muted?0:.62;master.connect(context.destination);
    }
    if(context.state!=='running')context.resume().catch(()=>{});
  }
  function makeSample(kind){
    if(samples.has(kind))return samples.get(kind);
    const length={wheel:wheelDuration+.075,cloth:1.55,light:.13}[kind];
    const buffer=context.createBuffer(1,Math.ceil(rate*length),rate),out=buffer.getChannelData(0);
    let seed=739;
    function noise(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/2147483648-1;}
    function tick(at,gain,frequency){
      const start=Math.floor(at*rate);
      let air=0;
      for(let i=0;i<rate*.043&&start+i<out.length;i++){
        const t=i/rate;
        air+=.70*(noise()-air);
        out[start+i]+=gain*Math.min(1,i/12)*Math.exp(-t*145)*
          (.72*air+.35*Math.sin(6.283*frequency*t)+.12*Math.sin(6.283*frequency*2.6*t));
      }
    }
    if(kind==='wheel'){
      // Invert the same decelerating rotation used by the drawn wheel.
      const toothAngle=Math.PI/8;
      for(let tooth=1;tooth*toothAngle<wheelTravel;tooth++){
        const speed=Math.sqrt(1-tooth*toothAngle/wheelTravel);
        tick(wheelDuration*(1-speed),(.33+.34*speed)*(.92+.08*noise()),1380+310*speed);
      }
    }else if(kind==='light'){
      tick(0,.69,760);tick(.023,.32,521);
    }else{
      let low=0,mid=0;
      for(let i=0;i<out.length;i++){
        const t=i/rate, n=noise();low+=.047*(n-low);mid+=.31*(n-mid);
        const swell=Math.sin(Math.PI*t/length)**2*(.63+.24*Math.cos(9*t)+.10*Math.cos(19*t));
        out[i]=swell*(.68*low+.42*mid);
      }
    }
    samples.set(kind,buffer);return buffer;
  }
  function place(voice){
    if(!camera)return;
    const [x,y,z]=voice.pos,m=camera;
    const dx=m[0]*x+m[4]*y+m[8]*z+m[12],dy=m[1]*x+m[5]*y+m[9]*z+m[13];
    const t=context.currentTime;
    if(voice.pan)voice.pan.pan.setTargetAtTime(Math.max(-.85,Math.min(.85,dx*.82)),t,.06);
    voice.gain.gain.setTargetAtTime(.92/(1+.7*(dx*dx+dy*dy)),t,.08);
  }
  function play(kind,pos){
    if(!context||muted||!visible||voices.size>12)return;
    if(kind==='wheel'&&spinVoice)spinVoice.source.stop();
    const source=context.createBufferSource(),gain=context.createGain();
    source.buffer=makeSample(kind);
    const pan=context.createStereoPanner?context.createStereoPanner():null;
    source.connect(gain);
    if(pan){gain.connect(pan);pan.connect(master);}else gain.connect(master);
    const v={source,gain,pan,pos};place(v);voices.add(v);
    if(kind==='wheel')spinVoice=v;
    source.onended=()=>{voices.delete(v);if(spinVoice===v)spinVoice=null;source.disconnect();gain.disconnect();pan?.disconnect();};
    source.start();
  }
  function setView(m){
    camera=m;
    for(const v of voices)place(v);
  }
  function setVisible(next){
    if(visible===next)return;
    visible=next;
    if(!context)return;
    if(!visible){
      for(const v of voices)v.source.stop();
      context.suspend().catch(()=>{});
    }else if(!muted)context.resume().catch(()=>{});
  }
  function toggle(){
    muted=!muted;
    try{localStorage.setItem('haruma.district.muted',muted?'yes':'no');}catch{}
    if(master)master.gain.setTargetAtTime(muted?0:.62,context.currentTime,.012);
    return muted;
  }
  return {wake,play,setView,setVisible,toggle};
}

    const aspect=width/Math.max(1,height),portrait=aspect<.84;
    if(id){
      const b=districtPlaces[id-1];
      return {center:b.center.slice(),yaw:b.yaw,tilt:.31,
        extent:Math.max(b.height*.61,b.width*.60/aspect)};
    }
    const yaw=portrait?-.69:.31,tilt=portrait?.49:.48,[r,u]=axes(yaw,tilt);
    const points=[];
    if(!portrait){
      for(const x of [-8,8])for(const z of [-8,8])for(const y of [-1.5,0])points.push([x,y,z]);
    }
    for(const b of districtPlaces){
      for(const d of [-1,1])for(const y of [0,b.height]){
        points.push([b.center[0]+d*b.width*.5,y,b.center[2]+.15]);
        points.push([b.center[0]+d*b.width*.5,y,b.center[2]-2.6]);
      }
    }
    if(portrait)points.push([-4.9,-.4,3.5],[2.5,-.4,4.5]);
    const xs=points.map(p=>dot(p,r)),ys=points.map(p=>dot(p,u));
    const left=Math.min(...xs),right=Math.max(...xs),top=Math.max(...ys),bottom=Math.min(...ys);
    const center=[0,1,0],dx=(left+right)/2-dot(center,r),dy=(top+bottom)/2-dot(center,u);
    const extent=Math.max((right-left)*.54/aspect,(top-bottom)*.545);
    return {yaw,tilt,extent,center:center.map((v,i)=>v+r[i]*dx+u[i]*dy)};
  }
  function locationId(){return districtPlaces.find(b=>'#'+b.slug===location.hash)?.id||0;}
  function address(id){
    const hash=id?'#'+districtPlaces[id-1].slug:'';
    if(location.hash===hash)return;
    try{history.replaceState(null,'',location.pathname+location.search+hash);}catch{}
  }
  function stopFlight(){transition=null;}
  function travel(id,instant=false,changeAddress=true){
    focus=id;hover=0;
    if(changeAddress)address(id);
    const to=poseFor(id);
    if(instant||reduced.matches||!view){view=to;transition=null;}
    else{
      const delta=to.yaw-view.yaw;
      to.yaw=view.yaw+Math.atan2(Math.sin(delta),Math.cos(delta));
      transition={from:view,to,start:performance.now()};
    }
    status.textContent=id?'正在参观'+districtPlaces[id-1].name+'。':'晴间街区全景。';
    request();
  }
  function currentWheel(now){
    return wheelBase+(Number.isFinite(wheelStart)?wheelTravel*wheelProgress((now-wheelStart)/1000):0);
  }
  function currentLight(now){
    return lightFrom+(lightTo-lightFrom)*smooth(clamp((now-lightStart)/930,0,1));
  }
  function interact(id){
    const b=districtPlaces[id-1];if(!b)return;
    const now=performance.now();
    if(id===1){
      lightFrom=currentLight(now);lightTo=1-lightTo;lightStart=reduced.matches?now-1000:now;
      audio.play('light',b.feature);status.textContent=lightTo?'茶铺柜台和楼上的灯亮了。':'茶铺的灯熄了。';
    }else if(id===2){
      wheelBase=currentWheel(now)%(2*Math.PI);wheelStart=now;
      audio.play('wheel',b.feature);status.textContent='车轮开始空转，棘轮声渐渐放慢。';
    }else{
      clothStart=now;audio.play('cloth',b.feature);status.textContent='风掀起床单，露出栏杆后面的植物。';
    }
    request();
  }
  function activate(hit,type){
    const owner=hit>10?hit-10:hit;
    if(owner<1||owner>3)return;
    if(hit>10&&(type!=='touch'||focus===owner))interact(owner);
    else if(focus!==owner){travel(owner);if(owner===1&&!lightTo)interact(1);}
    else if(owner===1)interact(1);
    else travel(owner);
  }
  function project(point){
    const m=lastMatrix,[x,y,z]=point;
    return [(1+m[0]*x+m[4]*y+m[8]*z+m[12])*width/2,
            (1-m[1]*x-m[5]*y-m[9]*z-m[13])*height/2];
  }
  function pick(x,y,type){
    let id=scene.pick(x,y,type==='touch');
    // Hit the empty spaces between spokes as well as the rim. Keep other buildings in front.
    if(lastMatrix&&lastEye[2]>.22&&(id===2||id===0)){
      const b=districtPlaces[1].feature,center=project(b);
      const a=project([b[0]+.455,b[1],b[2]]),c=project([b[0],b[1]+.455,b[2]]);
      const box=canvas.getBoundingClientRect(),dx=x-box.left-center[0],dy=y-box.top-center[1];
      const ax=a[0]-center[0],ay=a[1]-center[1],cx=c[0]-center[0],cy=c[1]-center[1];
      const det=ax*cy-ay*cx;
      if(Math.abs(det)>1){
        const i=(dx*cy-dy*cx)/det,j=(ax*dy-ay*dx)/det;
        if(i*i+j*j<=1)id=12;
      }
    }
    return id;
  }
  function navigating(){
    stopFlight();interactionUntil=performance.now()+170;
    clearTimeout(settle);settle=setTimeout(request,190);request();
  }
  function offset(point){
    const box=canvas.getBoundingClientRect(),[r,u]=axes(view.yaw,view.tilt);
    const x=(2*(point.x-box.left)-width)/height,y=1-2*(point.y-box.top)/height;
    return r.map((v,i)=>v*x+u[i]*y);
  }
  function pan(dx,dy){
    navigating();const [r,u]=axes(view.yaw,view.tilt),s=2*view.extent/height;
    view.center=view.center.map((v,i)=>clamp(v+s*(-dx*r[i]+dy*u[i]),-20,20));
  }
  function zoom(factor,point){
    navigating();const previous=view.extent;
    view.extent=clamp(previous/factor,.80,poseFor(0).extent*1.75);
    if(point){const v=offset(point);view.center=view.center.map((x,i)=>clamp(x+v[i]*(previous-view.extent),-20,20));}
  }
  function keyAction(key){
    if(key==='m'){status.textContent=audio.toggle()?'已静音。':'声音已打开。';return;}
    if(key==='home'||key==='escape'){travel(0);return;}
    if(['1','2','3'].includes(key)){travel(Number(key));return;}
    if((key==='enter'||key===' ')&&focus)interact(focus);
  }
  function request(){
    clearTimeout(timer);timer=0;
    if(!frame&&!document.hidden&&visible)frame=requestAnimationFrame(render);
  }
  function pulse(t,duration){return t>=0&&t<duration?Math.sin(Math.PI*t/duration)**2:0;}
  function render(now){
    frame=0;
    if(!visible||document.hidden)return;
    if(transition){
      const {from,to,start:t0}=transition,p=clamp((now-t0)/650,0,1),s=smooth(p);
      view={yaw:lerp(from.yaw,to.yaw,s),tilt:lerp(from.tilt,to.tilt,s),
        extent:Math.exp(lerp(Math.log(from.extent),Math.log(to.extent),s)),
        center:from.center.map((v,i)=>lerp(v,to.center[i],s))};
      if(p===1)transition=null;
    }
    const time=(now-start)/1000,windAge=(now-clothStart)/1000,windPhase=(time+14)%27;
    const natural=pulse(windPhase,2.8)*.28;
    const cloth=reduced.matches?0:Math.max(natural,pulse(windAge,2.7));
    const rainPhase=(time+32)%57,rain=reduced.matches?0:pulse(rainPhase,11);
    const spinning=now-wheelStart<wheelDuration*1000;
    const animating=!!transition||now-lightStart<960||(!reduced.matches&&spinning)||cloth>0||rain>0;
    const period=now-lastTimedFrame;
    if(lastTimedFrame&&period>52&&period<3000){if(++slowFrames>=5)economyUntil=now+4500;}
    else slowFrames=0;
    lastTimedFrame=animating||now<interactionUntil?now:0;
    const mobile=touchScreen.matches,economy=now<economyUntil;
    const native=window.devicePixelRatio||1, area=width*height;
    const budget=mobile?(now<interactionUntil?3.3e6:4.6e6):5e6;
    const quality=Math.min(mobile?Math.max(1.4,native):Math.min(2.3,Math.max(1.35,native)),
      4096/Math.max(width,height),Math.sqrt(budget/area));
    const {matrix,eye}=matrixOf(view);lastMatrix=matrix;lastEye=eye;audio.setView(matrix);
    const angle=reduced.matches&&Number.isFinite(wheelStart)?wheelBase+wheelTravel:currentWheel(now);
    scene.draw({matrix,eye,focus,hover,quality,mobile,economy,active:animating,
      wheelAngle:angle,lamp:currentLight(now),clothTime:cloth>0?time:0,clothAmplitude:cloth,
      rainTime:time,rainAmount:rain});
    if(!canvas.dataset.ready){canvas.dataset.ready='true';document.querySelector('.poster')?.remove();}
    if(animating){
      if(mobile||economy)timer=setTimeout(request,Math.max(0,1000/30-(performance.now()-now)-7));
      else request();
    }else if(!reduced.matches){
      // Sleep until the next breeze or passing shower.
      timer=setTimeout(request,Math.max(24,1000*Math.min(27-windPhase,57-rainPhase)+12));
    }
  }
  function layout(){
    const rect=canvas.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height);
    if(width===w&&height===h)return;
    width=w;height=h;travel(focus,true,false);
  }
  focus=locationId();layout();
  attachDistrictGestures(canvas,{pick,activate,pan,zoom,reset:()=>travel(0),unlockSound:audio.wake,keyAction,
    highlight(id){if(id!==hover){hover=id;request();}},
    orbit(dx,dy){navigating();view.yaw-=dx*.0065;view.tilt=clamp(view.tilt+dy*.0055,-1.12,1.49);}
  });
  function visibility(){
    audio.setVisible(!document.hidden&&visible);
    if(document.hidden||!visible){clearTimeout(timer);cancelAnimationFrame(frame);frame=0;lastTimedFrame=0;}
    else request();
  }
  document.addEventListener('visibilitychange',visibility);
  window.addEventListener('pagehide',()=>audio.setVisible(false));
  window.addEventListener('pageshow',visibility);
  window.addEventListener('hashchange',()=>travel(locationId(),false,false));
  reduced.addEventListener('change',()=>{if(reduced.matches&&transition){view=transition.to;transition=null;}request();});
  new ResizeObserver(layout).observe(canvas);
  new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;visibility();}).observe(canvas);
}

startDistrict().catch(error=>{
  const canvas=document.querySelector('canvas');
  canvas.dataset.error=error.message;
  const info=document.querySelector('[role=status]');
  info.className='error';
  info.textContent='当前浏览器未能启动 3D 画面。可用支持 WebGL 2 的浏览器打开街区。';
  console.error(error);
});
})();
</script></body></html>
