<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0efe5">
<meta name="description" content="沿着晴间街区的茶铺、修理棚、外廊公寓、巷尾花店和旧书报亭，逛一座可旋转的日式微缩街区。">
<title>晴间街区 · 长椅旁的旧书报亭</title>
<style>
*{box-sizing:border-box}html,body,main{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#f0efe5;color:#383e34;font-family:system-ui,sans-serif}
main{position:relative;height:100dvh;isolation:isolate}
canvas,.poster{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas:focus-visible{outline:2px solid #586e60;outline-offset:-3px}
.poster{background:#f0efe5;pointer-events:none}.poster img{width:100%;height:100%;object-fit:contain;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.error{position:absolute;bottom:1rem;left:1rem;right:1rem;text-align:center}
</style>
</head>
<body><main aria-label="晴间街区">
<canvas tabindex="0" role="application" aria-label="立体微缩街区，含晴间茶铺、自行车修理棚、外廊公寓、巷尾花店和旧书报亭。拖动旋转，滚轮或双指缩放，右键或双指移动。点建筑靠近，点茶铺的窗、修理棚车轮、公寓床单、花店水壶或报摊的报纸可以互动。双击空地或按 Home 回到全街。数字 1、2、3、4、5 可前往各栋，回车或空格体验当前建筑，两指同时轻点或按 M 切换静音。"></canvas>
<!-- POSTER -->
<span class="sr" role="status" aria-live="polite"></span>
<noscript><p class="error">请启用 JavaScript 以旋转和探索街区。</p></noscript>
</main><script>
(() => {
'use strict';
/* DISTRICT MODULES */
startDistrict().catch(error=>{
  const canvas=document.querySelector('canvas');
  canvas.dataset.error=error.message;
  const info=document.querySelector('[role=status]');
  info.className='error';
  info.textContent='当前浏览器未能启动 3D 画面。可用支持 WebGL 2 的浏览器打开街区。';
  console.error(error);
});
})();
</script></body></html>
