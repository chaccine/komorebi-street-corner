<script>
(()=>{
'use strict';
/* Expand the small construction drawing into flat-shaded, indexed geometry. */
function expandDrawing(drawing) {
  const positions = [], normals = [], colors = [], uvs = [], indices = [], parts = [];
  const palette = drawing.colors.map(hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)));
  const add = (a,b) => a.map((v,i) => v+b[i]);
  const sub = (a,b) => a.map((v,i) => v-b[i]);
  const mul = (a,s) => a.map(v=>v*s);
  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const unit = a => mul(a,1/(Math.hypot(...a)||1));
  function rotation([x,y,z]) {
    const a=Math.cos(x), b=Math.sin(x), c=Math.cos(y), d=Math.sin(y), e=Math.cos(z), f=Math.sin(z);
    return ([u,v,w]) => [e*c*u+(e*d*b-f*a)*v+(e*d*a+f*b)*w,
      f*c*u+(f*d*b+e*a)*v+(f*d*a-e*b)*w,-d*u+c*b*v+c*a*w];
  }
  let color;
  function polygon(points, tex) {
    let n=[0,0,0];
    for(let i=1;i<points.length-1 && Math.hypot(...n)<.5;i++){
      n=unit(cross(sub(points[i],points[0]),sub(points[i+1],points[0])));
    }
    if (Math.hypot(...n)<.5) return;
    const first=positions.length/3;
    for (let i=0;i<points.length;i++) {
      positions.push(...points[i]); normals.push(...n); colors.push(...color);
      uvs.push(...(tex ? tex[i] : [0,0]));
    }
    for(let i=1;i<points.length-1;i++) indices.push(first,first+i,first+i+1);

const vertexSource=`#version 300 es
precision highp float;
layout(location=0) in vec3 position;
layout(location=1) in vec3 normal;
layout(location=2) in vec3 color;
layout(location=3) in vec2 uv;
uniform mat4 camera,sunCamera,sunsetCamera;
uniform highp int objectId;
uniform float windAge;
out vec3 vNormal,vColor,vWorld,vSun,vSunset;
out vec2 vUv;
${windVertexGLSL}
void main(){
 vec3 p=position;
 if(objectId==1&&windAge>=0.)p+=gustOffset(p,windAge);
 gl_Position=camera*vec4(p,1.);
 vSun=(sunCamera*vec4(p,1.)).xyz*.5+.5;
 vSunset=(sunsetCamera*vec4(p,1.)).xyz*.5+.5;
 vNormal=normal; vColor=color; vUv=uv; vWorld=p;
}`;
const depthFragment=`#version 300 es
precision highp float;
out vec4 outColor;
void main(){ outColor=vec4(1.); }`;
const sceneFragment=`#version 300 es
precision highp float;
in vec3 vNormal,vColor,vWorld,vSun,vSunset;
in vec2 vUv;
uniform sampler2D atlas;
uniform highp sampler2D shadowMap,sunsetMap;
uniform vec3 lightDirection,viewDirection,eveningDirection;
uniform float dusk,machineLight;
uniform highp int objectId;
uniform bool stage;
out vec4 outColor;
float inkShadow(highp sampler2D map,vec3 coord,float incidence){
 if(any(lessThan(coord,vec3(.001)))||any(greaterThan(coord,vec3(.999))))return 1.;
 vec2 texel=1./vec2(textureSize(map,0));
 float bias=.00022+.00062*(1.-abs(incidence));
 float visible=0.;
 for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
   vec2 uv=coord.xy+vec2(float(i),float(j))*texel*1.25;
   visible+=step(coord.z-bias, texture(map,uv).r);
 }
 return visible/9.;
}
void main(){
 vec3 n=normalize(vNormal);
 if(dot(n,viewDirection)<0.)n=-n;
 if(stage){
   vec2 q=abs(vWorld.xz-vec2(-.10,.08))-vec2(4.97);
   float outside=length(max(q,vec2(0)))+min(max(q.x,q.y),0.);
   float nearShade=exp(-max(outside,0.)*3.3);
   vec2 w=(vWorld.xz-vec2(-.8,.5))/vec2(6.2,5.7);
   float pool=exp(-dot(w,w)*.9);
   float halo=exp(-dot(vWorld.xz/18.,vWorld.xz/18.));
   vec3 paper=mix(vec3(.931,.930,.887),vec3(.977,.965,.920),halo);
   vec3 eveningPaper=mix(vec3(.765,.749,.788),vec3(.965,.848,.700),halo);
   outColor=vec4(mix(paper,eveningPaper,dusk)*(1.-.21*nearShade-.085*pool),0.);
   return;
 }
 vec4 decal=texture(atlas,vUv);
 if(decal.a<.40)discard;
 float ndl=dot(n,lightDirection);

 if(dusk<.999)vis=inkShadow(shadowMap,vSun,ndl);
 float diffuse=.23*smoothstep(-.17,-.02,ndl)+.48*smoothstep(.12,.24,ndl)+.29*smoothstep(.55,.68,ndl);
 vec3 ambient=mix(vec3(.66,.713,.737),vec3(.805,.845,.858),n.y*.5+.5);
 vec3 sunlight=vec3(.298,.248,.185)*diffuse*vis;
 vec3 c=vColor*(ambient+sunlight);
 c+=vec3(.013,.012,.005)*smoothstep(.3,.8,ndl)*vis;
 if(dusk>.001){
   float low=dot(n,eveningDirection);
   float direct=inkShadow(sunsetMap,vSunset,low)*smoothstep(-.06,.48,low);
   vec3 twilight=mix(vec3(.42,.43,.56),vec3(.60,.62,.74),n.y*.5+.5);
   vec3 evening=vColor*(twilight+vec3(.64,.37,.12)*direct);
   if(objectId==3){
     bool upstairs=vWorld.y>2.70 && vWorld.y<4.08;
     bool glass=vColor.g>vColor.r*1.08 && vColor.b>vColor.g*.91 && vColor.b< vColor.g*1.21;
     bool curtains=vWorld.z>.10 && vWorld.z<.135 && vColor.r>vColor.g && vColor.b<vColor.r*.88;
     if(upstairs && abs(n.y)<.2 && (glass||curtains)){
       float lamp=clamp(.34+.40*(1.-(vWorld.y-2.70)/1.38)+.22*vColor.g,0.,1.);
       vec3 warm=glass?vec3(1.,.735,.352):vec3(.99,.805,.51);
       evening=mix(evening,warm,lamp);

const screenVertex=`#version 300 es
precision highp float;
out vec2 tex;
void main(){

const screenFragment=`#version 300 es

function program(gl,vertex,fragment){

const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];

const unit=a=>{const l=Math.hypot(...a);return a.map(x=>x/l)};
function unpack(raw){

function basis(dir){const right=unit(cross([0,1,0],dir));return [right,cross(dir,right),dir];}

function createTransientGeometry(gl){

   gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,36,i*12);
 }

 function begin(){occupied=0;ranges.length=0;}
 function emit(name,xyz,rgb){
   const start=occupied/9, end=occupied+xyz.length*3;
   if(end>data.length){
     const larger=new Float32Array(Math.max(end,data.length*2));larger.set(data);data=larger;
   }
   for(let i=0;i<xyz.length;i+=9){
     const ax=xyz[i+3]-xyz[i],ay=xyz[i+4]-xyz[i+1],az=xyz[i+5]-xyz[i+2];
     const bx=xyz[i+6]-xyz[i],by=xyz[i+7]-xyz[i+1],bz=xyz[i+8]-xyz[i+2];
     const nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;
     const length=Math.hypot(nx,ny,nz)||1;
     for(let p=i;p<i+9;p+=3){
       data[occupied++]=xyz[p];data[occupied++]=xyz[p+1];data[occupied++]=xyz[p+2];
       data[occupied++]=nx/length;data[occupied++]=ny/length;data[occupied++]=nz/length;
       data[occupied++]=rgb[p];data[occupied++]=rgb[p+1];data[occupied++]=rgb[p+2];
     }

async function start(){
 const bytes=Uint8Array.from(atob(compressed),c=>c.charCodeAt(0));
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
 const drawing=unpack(new Uint8Array(await new Response(stream).arrayBuffer()));
 const img=new Image();img.src='data:image/png;base64,'+drawing.atlas;await img.decode();
 const mesh=expandDrawing(drawing);
 const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
 if(!gl)throw Error('WebGL 2 unavailable');
 gl.disable(gl.DITHER);
 const main=program(gl,vertexSource,sceneFragment), shadow=program(gl,vertexSource,depthFragment), post=program(gl,screenVertex,screenFragment);
 function locations(pr,names){return Object.fromEntries(names.map(n=>[n,gl.getUniformLocation(pr,n)]));}
 const mainLoc=locations(main,['camera','sunCamera','sunsetCamera','lightDirection','eveningDirection','viewDirection','atlas','shadowMap','sunsetMap','stage','objectId','windAge','dusk','machineLight']);
 const shadowLoc=locations(shadow,['camera','objectId','windAge']);
 const postLoc=locations(post,['painting','depthImage','pixel','resolution','worldPerPixel']);
 function buffer(slot,data,size,type,normalized=false){
   const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
   gl.enableVertexAttribArray(slot);gl.vertexAttribPointer(slot,size,type,normalized,0,0);
 }
 const modelVAO=gl.createVertexArray();gl.bindVertexArray(modelVAO);
 buffer(0,mesh.positions,3,gl.FLOAT);buffer(1,mesh.normals,3,gl.FLOAT);buffer(2,mesh.colors,3,gl.UNSIGNED_BYTE,true);buffer(3,mesh.uvs,2,gl.FLOAT);
 const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,mesh.indices,gl.STATIC_DRAW);
 const objectIds={'樟树':1,'汽水售货机':2,'喫茶店':3};
 const groups=mesh.parts.map(part=>({...part,id:objectIds[part.name]||0}));
 const transient=createTransientGeometry(gl);
 function drawModel(idLocation){
   gl.bindVertexArray(modelVAO);
   for(const part of groups){
     gl.uniform1i(idLocation,part.id);
     gl.drawElements(gl.TRIANGLES,part.count,gl.UNSIGNED_INT,part.start*4);
   }
   transient.draw(idLocation);
 }
 let bottom=0;for(let i=1;i<mesh.positions.length;i+=3)bottom=Math.min(bottom,mesh.positions[i]);
 const floor=bottom-.035, groundVAO=gl.createVertexArray();gl.bindVertexArray(groundVAO);
 buffer(0,new Float32Array([-180,floor,-180,-180,floor,180,180,floor,-180,180,floor,180]),3,gl.FLOAT);
 const emptyVAO=gl.createVertexArray();gl.bindVertexArray(null);
 function texture(internal,format,type,w,h,filter){
   const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
   gl.texImage2D(gl.TEXTURE_2D,0,internal,w,h,0,format,type,null);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;
 }
 const atlas=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,atlas);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 function attached(slot,tex){gl.framebufferTexture2D(gl.FRAMEBUFFER,slot,gl.TEXTURE_2D,tex,0);}
 function checkTarget(){if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) throw Error('Incomplete drawing buffer');}
 const shadowSize=Math.min(2048,gl.getParameter(gl.MAX_TEXTURE_SIZE));
 function makeLight(direction){
   direction=unit(direction);
   const target=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,target);
   const map=texture(gl.DEPTH_COMPONENT24,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,shadowSize,shadowSize,gl.NEAREST);
   attached(gl.DEPTH_ATTACHMENT,map);gl.drawBuffers([gl.NONE]);gl.readBuffer(gl.NONE);checkTarget();
   return {direction,target,map,matrix:projection(basis(direction),[0,1.7,0],9,9,18),revision:-1,updated:-Infinity};
 }
 const day=makeLight([.72,1.63,.37]), evening=makeLight([1.20,.68,-.65]);
 const wind=createWindEffect(),machine=createVendingEffect();
 const motion=window.matchMedia('(prefers-reduced-motion: reduce)');
 let revision=0,lastMoving=false;
 function updateShadow(light,now,age,moving){
   if(light.revision===revision)return;
   if(moving&&now-light.updated<100)return;
   gl.bindFramebuffer(gl.FRAMEBUFFER,light.target);gl.viewport(0,0,shadowSize,shadowSize);
   gl.enable(gl.DEPTH_TEST);gl.clear(gl.DEPTH_BUFFER_BIT);
   gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1.65,2.);
   gl.useProgram(shadow);gl.uniformMatrix4fv(shadowLoc.camera,false,light.matrix);
   gl.uniform1f(shadowLoc.windAge,age);drawModel(shadowLoc.objectId);gl.disable(gl.POLYGON_OFFSET_FILL);
   light.updated=now;light.revision=revision;

 let duskStart=0,duskFrom=0,duskTo=0;
 function lightingAt(now){
   const t=motion.matches?1:Math.min(1,(now-duskStart)/1150);
   return duskFrom+(duskTo-duskFrom)*t*t*(3-2*t);

 const frame=gl.createFramebuffer();let paint=null,depth=null,quality=1,width=0,height=0;
 const bind=(n,t)=>{gl.activeTexture(gl.TEXTURE0+n);gl.bindTexture(gl.TEXTURE_2D,t);};
 let yaw=.570,elevation=.477,zoom=1,pan=[0,0,0],scheduled=false,baseExtent=6.9;
 const direction=()=>[Math.sin(yaw)*Math.cos(elevation),Math.sin(elevation),Math.cos(yaw)*Math.cos(elevation)];
 const original=basis(direction()),bounds=[[Infinity,-Infinity],[Infinity,-Infinity]];
 for(let i=0;i<mesh.positions.length;i+=3){
   for(let j=0;j<2;j++){
     const a=original[j],v=mesh.positions[i]*a[0]+mesh.positions[i+1]*a[1]+mesh.positions[i+2]*a[2];
     bounds[j][0]=Math.min(bounds[j][0],v);bounds[j][1]=Math.max(bounds[j][1],v);
   }

 // Centre the initial silhouette around a stable pivot inside the diorama.
 const pivot=[0,1.7,0];const offset=bounds.map((b,i)=>(b[1]+b[0])/2-dot(pivot,original[i]));
 const center=pivot.map((v,i)=>v+original[0][i]*offset[0]+original[1][i]*offset[1]);
 function resize(playing){
   const r=canvas.getBoundingClientRect();
   const preferred=playing?1.15:Math.max(1.65,window.devicePixelRatio);
   quality=Math.max(1,Math.min(2.2,preferred,2800/Math.max(r.width,r.height)));
   const w=Math.max(1,Math.round(r.width*quality)),h=Math.max(1,Math.round(r.height*quality));
   if(width===w&&height===h)return;
   width=canvas.width=w;height=canvas.height=h;
   baseExtent=Math.max((bounds[1][1]-bounds[1][0])*.545,(bounds[0][1]-bounds[0][0])*.55*h/w);
   gl.bindFramebuffer(gl.FRAMEBUFFER,frame);gl.activeTexture(gl.TEXTURE0);
   if(paint){gl.deleteTexture(paint);gl.deleteTexture(depth);}

   depth=texture(gl.DEPTH_COMPONENT24,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,w,h,gl.NEAREST);
   attached(gl.COLOR_ATTACHMENT0,paint);attached(gl.DEPTH_ATTACHMENT,depth);checkTarget();

 function render(){
   scheduled=false;
   const now=performance.now(),dusk=lightingAt(now);
   transient.begin();
   const breeze=wind.sample(now,transient.emit),vend=machine.sample(now,transient.emit);
   transient.upload();
   const moving=breeze.active||vend.active,playing=moving||Math.abs(dusk-duskTo)>.0001;
   if(moving||lastMoving)revision++;lastMoving=moving;
   if(dusk<.999)updateShadow(day,now,breeze.age,moving);
   if(dusk>.001)updateShadow(evening,now,breeze.age,moving);
   resize(playing);const eye=direction(),ext=baseExtent/zoom,ratio=width/height;
   const camera=projection(basis(eye),center.map((v,i)=>v+pan[i]),ext*ratio,ext,48);
   gl.bindFramebuffer(gl.FRAMEBUFFER,frame);gl.viewport(0,0,width,height);
   gl.clearColor(.931-.166*dusk,.930-.181*dusk,.887-.099*dusk,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);
   gl.useProgram(main);gl.uniformMatrix4fv(mainLoc.camera,false,camera);gl.uniformMatrix4fv(mainLoc.sunCamera,false,day.matrix);
   gl.uniformMatrix4fv(mainLoc.sunsetCamera,false,evening.matrix);
   gl.uniform3fv(mainLoc.lightDirection,day.direction);gl.uniform3fv(mainLoc.eveningDirection,evening.direction);gl.uniform3fv(mainLoc.viewDirection,eye);
   gl.uniform1f(mainLoc.dusk,dusk);gl.uniform1f(mainLoc.windAge,breeze.age);gl.uniform1f(mainLoc.machineLight,vend.glow);
   bind(0,atlas);bind(1,day.map);bind(2,evening.map);gl.uniform1i(mainLoc.atlas,0);gl.uniform1i(mainLoc.shadowMap,1);gl.uniform1i(mainLoc.sunsetMap,2);
   if(elevation>.08){
     gl.uniform1i(mainLoc.stage,1);gl.uniform1i(mainLoc.objectId,0);gl.bindVertexArray(groundVAO);gl.vertexAttrib3f(1,0,1,0);
     gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
   }
   gl.uniform1i(mainLoc.stage,0);drawModel(mainLoc.objectId);
   gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.disable(gl.DEPTH_TEST);
   gl.useProgram(post);bind(0,paint);bind(1,depth);gl.uniform1i(postLoc.painting,0);gl.uniform1i(postLoc.depthImage,1);
   gl.uniform2f(postLoc.pixel,1/width,1/height);gl.uniform1f(postLoc.resolution,Math.max(.85,quality*.74));
   gl.uniform1f(postLoc.worldPerPixel,ext*2/height);gl.bindVertexArray(emptyVAO);gl.drawArrays(gl.TRIANGLES,0,3);
   if(!canvas.dataset.ready){root.querySelector('img')?.remove();canvas.dataset.ready='true';}
   if(playing)request();
 }
 function request(){if(!scheduled){scheduled=true;requestAnimationFrame(render);}}
 const limit=(x,low,high)=>Math.max(low,Math.min(high,x));
 function dolly(factor){zoom=limit(zoom*factor,.42,7.5);}
 function shift(dx,dy){
   const [r,u]=basis(direction()),k=2*baseExtent/zoom/Math.max(1,canvas.clientHeight);
   pan=pan.map((v,i)=>limit(v+k*(-dx*r[i]+dy*u[i]),-18,18));
 }
 const pickedPixel=new Uint8Array(4);
 function pick(clientX,clientY){
   if(!width || !height)return 0;
   const rect=canvas.getBoundingClientRect();
   const x=Math.floor((clientX-rect.left)/rect.width*width);
   const y=height-1-Math.floor((clientY-rect.top)/rect.height*height);
   if(x<0||x>=width||y<0||y>=height)return 0;
   gl.bindFramebuffer(gl.READ_FRAMEBUFFER,frame);
   gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pickedPixel);
   gl.bindFramebuffer(gl.READ_FRAMEBUFFER,null);

 function activate(id){
   const now=performance.now();
   if(id===1)wind.trigger(now,motion.matches);
   if(id===2)machine.trigger(now,motion.matches);
   if(id===3){duskFrom=lightingAt(now);duskStart=now;duskTo=1-duskTo;}
   revision++;request();

 attachSceneGestures(canvas,{
   pick,activate,
   orbit(dx,dy){yaw-=dx*.007;elevation=limit(elevation+dy*.006,-1.53,1.53);request();},
   pan(dx,dy){shift(dx,dy);request();},
   zoom(ratio){dolly(ratio);request();},
   reset(){yaw=.570;elevation=.477;zoom=1;pan=[0,0,0];request();}
 });
 new ResizeObserver(request).observe(root);render();
}
start().catch(error=>{canvas.dataset.error=error.message;console.error(error);});
})();
